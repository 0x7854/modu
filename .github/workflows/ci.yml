name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / npm test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The default test suite is server/API only; skip multi-hundred-MB
          # Electron and browser downloads that packaged/UI tests would need.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run core tests
        run: npm test

      - name: Check Apple Shortcut condition format
        run: python3 test/shortcut-format.test.py
